name: Publish Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: read

env:
  RUNNER_OPENCLAW_VERSION: 2026.6.1
  RUNNER_WECHAT_PLUGIN_SPEC: "@tencent-weixin/openclaw-weixin@2.4.4"

jobs:
  detect-changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.filter.outputs.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect runner changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            runner:
              - "containers/openclaw-runner/**"
              - ".github/workflows/publish-images.yml"

  build-images:
    name: Build ${{ matrix.label }}
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: api image
            image_name: claw-manager-api
            context: backend
            dockerfile: Dockerfile
          - label: web image
            image_name: claw-manager-web
            context: frontend
            dockerfile: Dockerfile
          - label: runner image
            image_name: claw-manager-openclaw-runner
            context: .
            dockerfile: containers/openclaw-runner/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide whether to build
        id: gate
        shell: bash
        run: |
          should_build=false
          if [ "${{ matrix.image_name }}" != "claw-manager-openclaw-runner" ]; then
            should_build=true
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            should_build=true
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            should_build=true
          elif [ "${{ needs.detect-changes.outputs.runner }}" = "true" ]; then
            should_build=true
          fi
          echo "should_build=${should_build}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Prepare image name
        if: steps.gate.outputs.should_build == 'true'
        id: prep
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${{ matrix.image_name }}" >> "$GITHUB_OUTPUT"

      - name: Prepare runner metadata
        if: steps.gate.outputs.should_build == 'true'
        id: runner_meta
        shell: bash
        run: |
          if [ "${{ matrix.image_name }}" = "claw-manager-openclaw-runner" ]; then
            openclaw_version="${RUNNER_OPENCLAW_VERSION}"
            {
              echo "openclaw_version=${openclaw_version}"
              printf 'build_args<<EOF\nOPENCLAW_VERSION=%s\nOPENCLAW_WECHAT_PLUGIN_SPEC=%s\nEOF\n' \
                "$openclaw_version" \
                "$RUNNER_WECHAT_PLUGIN_SPEC"
              printf 'extra_labels<<EOF\nio.clawbot.openclaw.version=%s\nEOF\n' "$openclaw_version"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "openclaw_version="
              echo "build_args="
              printf 'extra_labels<<EOF\nEOF\n'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        if: steps.gate.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.prep.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: steps.gate.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        if: steps.gate.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            ${{ steps.runner_meta.outputs.extra_labels }}
          build-args: ${{ steps.runner_meta.outputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Skip unchanged runner image
        if: steps.gate.outputs.should_build != 'true'
        run: echo "Runner image was not rebuilt because runner files did not change."

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-images
    runs-on: ubuntu-latest

    steps:
      - name: Prepare release notes
        id: notes
        shell: bash
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          tag="${GITHUB_REF_NAME}"
          cat > release-notes.md <<EOF
          ## Container Images

          - API image: \`ghcr.io/${owner}/claw-manager-api:${tag}\`
          - Web image: \`ghcr.io/${owner}/claw-manager-web:${tag}\`
          - Runner image: \`ghcr.io/${owner}/claw-manager-openclaw-runner:${tag}\`

          ## Pull Commands

          \`\`\`bash
          docker pull ghcr.io/${owner}/claw-manager-api:${tag}
          docker pull ghcr.io/${owner}/claw-manager-web:${tag}
          docker pull ghcr.io/${owner}/claw-manager-openclaw-runner:${tag}
          \`\`\`

          ## Latest Aliases

          - \`ghcr.io/${owner}/claw-manager-api:latest\`
          - \`ghcr.io/${owner}/claw-manager-web:latest\`
          - \`ghcr.io/${owner}/claw-manager-openclaw-runner:latest\`
          EOF

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: ${{ github.ref_name }}
