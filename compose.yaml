services:
  mysql:
    image: mysql:8.4
    container_name: claw-manager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: clawbot_root
      MYSQL_DATABASE: clawbot
      MYSQL_USER: clawbot
      MYSQL_PASSWORD: clawbot
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uclawbot -pclawbot --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: claw-manager-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30

  api:
    image: ${CLAW_MANAGER_API_IMAGE:-ghcr.io/zhangsen540445123/claw-manager-api:latest}
    container_name: claw-manager-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    environment:
      API_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: clawbot
      MYSQL_USER: clawbot
      MYSQL_PASSWORD: clawbot
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIAPP_OPEN_API_BASE_URL: ${MINIAPP_OPEN_API_BASE_URL:-https://www.caoxf.nyc.mn/api}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-14}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_NAME: ${ADMIN_NAME:-平台管理员}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      OPENCLAW_RUNNER_IMAGE: ${OPENCLAW_RUNNER_IMAGE:-ghcr.io/zhangsen540445123/claw-manager-openclaw-runner:latest}
      OPENCLAW_RUNNER_PULL_TIMEOUT_MS: ${OPENCLAW_RUNNER_PULL_TIMEOUT_MS:-600000}
      OPENCLAW_RUNNER_CPUS: "${OPENCLAW_RUNNER_CPUS:-1.0}"
      OPENCLAW_RUNNER_MEMORY: ${OPENCLAW_RUNNER_MEMORY:-2g}
      OPENCLAW_RUNNER_MEMORY_SWAP: ${OPENCLAW_RUNNER_MEMORY_SWAP:-4g}
      OPENCLAW_RUNNER_NODE_MAX_OLD_SPACE_MB: ${OPENCLAW_RUNNER_NODE_MAX_OLD_SPACE_MB:-1536}
      OPENCLAW_WECHAT_BIND_TIMEOUT_MS: ${OPENCLAW_WECHAT_BIND_TIMEOUT_MS:-600000}
      OPENCLAW_GATEWAY_READY_TIMEOUT_MS: ${OPENCLAW_GATEWAY_READY_TIMEOUT_MS:-1800000}
      OPENCLAW_GATEWAY_READY_CHECK_INTERVAL_MS: ${OPENCLAW_GATEWAY_READY_CHECK_INTERVAL_MS:-10000}
      OPENCLAW_GATEWAY_READY_PROBE_TIMEOUT_MS: ${OPENCLAW_GATEWAY_READY_PROBE_TIMEOUT_MS:-5000}
      OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS: "${OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS:-*}"
      CLAWBOT_OOM_DIAGNOSTICS_ENABLED: "${CLAWBOT_OOM_DIAGNOSTICS_ENABLED:-true}"
      CLAWBOT_OOM_DIAGNOSTICS_INTERVAL_MS: "${CLAWBOT_OOM_DIAGNOSTICS_INTERVAL_MS:-30000}"
      CLAWBOT_OOM_DIAGNOSTICS_RETENTION_DAYS: "${CLAWBOT_OOM_DIAGNOSTICS_RETENTION_DAYS:-7}"
      CLAWBOT_OOM_DIAGNOSTICS_METRICS_LIMIT_MIB: "${CLAWBOT_OOM_DIAGNOSTICS_METRICS_LIMIT_MIB:-256}"
      CLAWBOT_OOM_DIAGNOSTICS_MIN_FREE_DISK_GIB: "${CLAWBOT_OOM_DIAGNOSTICS_MIN_FREE_DISK_GIB:-30}"
      CLAWBOT_OOM_HEAP_SNAPSHOT_INSTANCE_IDS: "${CLAWBOT_OOM_HEAP_SNAPSHOT_INSTANCE_IDS:-mskgjut8-696d76,mskgjwgm-cfd552,mskgk1at-0f66eb,mskgk7u2-b24856,mskgk332-da8bdb}"
      CLAWBOT_OOM_HEAP_SNAPSHOT_MAX_COUNT: "${CLAWBOT_OOM_HEAP_SNAPSHOT_MAX_COUNT:-5}"
      CLAWBOT_OOM_HEAP_SNAPSHOT_MAX_TOTAL_GIB: "${CLAWBOT_OOM_HEAP_SNAPSHOT_MAX_TOTAL_GIB:-12}"
      CLAWBOT_OOM_HEAP_SNAPSHOT_PER_INSTANCE_MAX_COUNT: "${CLAWBOT_OOM_HEAP_SNAPSHOT_PER_INSTANCE_MAX_COUNT:-1}"
      CLAWBOT_OOM_HEAP_SNAPSHOT_MIN_INTERVAL_MS: "${CLAWBOT_OOM_HEAP_SNAPSHOT_MIN_INTERVAL_MS:-600000}"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    image: ${CLAW_MANAGER_WEB_IMAGE:-ghcr.io/zhangsen540445123/claw-manager-web:latest}
    container_name: claw-manager-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_HOST_PORT:-4300}:80"

volumes:
  mysql-data:
  redis-data:
